name: Build Fud AI unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Fud AI (unsigned, generic iOS device)
        run: |
          xcodebuild \
            -project ios/calorietracker.xcodeproj \
            -scheme calorietracker \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Assemble unsigned IPA
        run: |
          APP=$(find "$RUNNER_TEMP/DD/Build/Products/Release-iphoneos" -maxdepth 1 -name "*.app" | head -1)
          echo "App bundle: $APP"
          test -d "$APP"
          rm -rf Payload FudAI-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          # Sideloading re-signs the main app with a personal-team bundle
          # id, which invalidates the Watch app's companion id
          # (InvalidCompanionAppBundleIdentifier). Ship no Watch app.
          rm -rf Payload/*.app/Watch
          zip -qry FudAI-unsigned.ipa Payload
          ls -lh FudAI-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FudAI-unsigned-ipa
          path: FudAI-unsigned.ipa
          retention-days: 14
